def compatProjects = compatConfig.keySet().collect { path -> project(path) }

// activeCompats must be defined BEFORE apply from: so the applied script can reference it via ext.
ext.activeCompats = compatConfig
        .findAll { _, spec -> spec.enabled }
        .collect { path, _ -> project(path) }

apply from: "$rootDir/gradle/lang-merge-and-conflicts.gradle"

tasks.register('runAllCompatAndDataRunData') {
    group = 'mod development'
    description = 'Runs runData for :data and all compat subprojects, then aggregates lang files into core.'

    def runDataProjects = [project(':data')] + activeCompats
    dependsOn(runDataProjects.collect { it.tasks.named('runData') })
    finalizedBy(tasks.named('aggregateLangResources'))
}

project(':core') {
    neoForge {
        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }

        runs {
            client {
                client()
                gameDirectory = rootProject.file('run')
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                gameDirectory = rootProject.file('run')
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            gameTestServer {
                type = 'gameTestServer'
                gameDirectory = rootProject.file('run')
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }
    }

    dependencies {
        // JEI
        compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
        runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

        // EMI WIP
        compileOnly("dev.emi:emi-neoforge:${emi_version}:api")
//    runtimeOnly("dev.emi:emi-neoforge:${emi_version}")
    }

}

project(':data') {
    neoForge {
        mods {
            "${mod_id}" {
                def coreMainSourceSet = rootProject.project(':core').sourceSets.main
                def coreGeneratedSourceSet = rootProject.project(':core').sourceSets.generated
                sourceSet(coreGeneratedSourceSet)
                sourceSet(coreMainSourceSet)
                sourceSet(sourceSets.generated)
                sourceSet(sourceSets.main)
            }
        }

        runs {
            data {
                clientData()
                programArguments.addAll '--mod', project.mod_id, '--all',
                        '--output', rootProject.project(':core').file('src/generated/resources/').getAbsolutePath(),
                        '--existing', rootProject.project(':core').file('src/main/resources/').getAbsolutePath()
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }
    }

    dependencies {
        implementation project(':core')
    }
}

// New compat onboarding checklist:
// 1) Add include in settings.gradle: include 'compat-<newmod>'
// 2) Add one entry in compatConfig (enabled + deps)
// 3) Add project jar to root moduleJars aggregation list (if needed)

configure(compatProjects) {
    if (!rootProject.ext.activeCompats.contains(project)) return
    dependencies {
        implementation project(':core')
        def extraDeps = compatConfig[project.path]?.deps
        if (extraDeps != null) {
            extraDeps.delegate = delegate
            extraDeps.resolveStrategy = DELEGATE_FIRST
            extraDeps.call()
        }
    }
}

configure(activeCompats) {
    neoForge {
        mods {
            "${mod_id}" {
                def coreMainSourceSet = rootProject.project(':core').sourceSets.main
                def coreGeneratedSourceSet = rootProject.project(':core').sourceSets.generated
                sourceSet(coreGeneratedSourceSet)
                // Attach current compat classes/resources so runClient/runData can load compat implementations.
                sourceSet(sourceSets.generated)
                sourceSet(sourceSets.main)
                // Attach core main last so it wins on classpath/resource conflicts
                sourceSet(coreMainSourceSet)
            }
        }

        runs {
            client {
                client()
                gameDirectory = rootProject.file('run')
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                gameDirectory = rootProject.file('run')
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            gameTestServer {
                type = 'gameTestServer'
                gameDirectory = rootProject.file('run')
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            data {
                clientData()
                programArguments.addAll '--mod', project.mod_id, '--all',
                        '--output', file('src/generated/resources/').getAbsolutePath(),
                        '--existing', rootProject.project(':core').file('src/main/resources/').getAbsolutePath(),
                        '--existing', file('src/main/resources/').getAbsolutePath()
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }
    }
}

def inactiveCompats = compatProjects - activeCompats
configure(inactiveCompats) {
    // Keep disabled compat modules out of root ':build' task graph.
    tasks.configureEach {
        if (name in [
                'build', 'assemble', 'check',
                'compileJava', 'processResources', 'classes',
                'jarJar', 'jar',
                'compileTestJava', 'processTestResources', 'testClasses', 'test',
                'createMinecraftArtifacts'
        ]) {
            enabled = false
        }
    }
}

tasks.named('jar', Jar).configure {
    // TODO build-invocation: prefer using ':jar' (or a dedicated aggregate task alias) instead of unqualified 'jar'
    // to avoid task selector resolving subproject jar tasks unexpectedly.
    notCompatibleWithConfigurationCache('Aggregates subproject jars via zipTree providers.')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def moduleJars = [project(':core').tasks.named('jar')]
    activeCompats.forEach { compatProject ->
        moduleJars.add(compatProject.tasks.named('jar'))
    }
//    def moduleJars = [project(':core').tasks.named('jar'),
//                      // Keep this list in sync when adding/removing compat modules.
//                      project(':compat-apotheosis').tasks.named('jar'),
//                      project(':compat-farmersdelight').tasks.named('jar'),
//                      project(':compat-fruitsdelight').tasks.named('jar'),
//                      project(':compat-kaleidoscope').tasks.named('jar'),
//                      project(':compat-neapolitan').tasks.named('jar'),
//                      project(':compat-youkaishomecoming').tasks.named('jar')]

    dependsOn(moduleJars)
    dependsOn(tasks.named('validateCrossProjectResourceConflicts'))
    from(moduleJars.collect { jarTask -> jarTask.flatMap { it.archiveFile }.map { archive -> zipTree(archive) } })
    // Root aggregate excludes datagen implementation while subproject jars keep datagen classes for runData workflows.
    exclude 'com/lnatit/ccw/datagen/**'

    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
