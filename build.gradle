plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.88'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

var build_version = mod_version
var build_id = System.getenv("BUILD_ID")
if (build_id != null) build_version = "${mod_version}+b${build_id}"

version = "v${build_version}-mc${minecraft_version}"
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://modmaven.dev" }
    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.shedaniel.me/" }
    // Registrate
    maven { url = "https://maven.ithundxr.dev/snapshots" }

    flatDir {
        dir 'libs'
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

def compats = ["YF": "youkaisFeasts",
               "YH": "youkaisHomecoming"]

// Include resources generated by data generators.
sourceSets {
    datagen {
        resources {
            compats.each { suffix, name ->
                srcDirs += "src/datagen/resources_${suffix.toLowerCase()}"
            }
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }

    compats.each { suffix, name ->
        create("${name}") {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }

//    configureEach {
//        if (name != 'main' && name != 'test') {
//            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
//            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
//        }
//    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            sourceSet = project.sourceSets.datagen
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/datagen/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        compats.each { suffix, name ->
            // 动态注册 run configuration，比如 dataYf, dataYh
            create("data${suffix}") {
                data()
                sourceSet = sourceSets[name]
                def outputDir = file("src/datagen/resources_${suffix.toLowerCase()}/").getAbsolutePath()
                def compatResDir = file("src/${name}/resources/").getAbsolutePath()
                def mainResDir = file('src/main/resources/').getAbsolutePath()
                programArguments.addAll '--mod', project.mod_id, '--all',
                        '--output', outputDir,
                        '--existing', mainResDir,
                        '--existing', compatResDir
            }
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

