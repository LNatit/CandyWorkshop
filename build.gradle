plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

var buildVersion = mod_version
var buildId = System.getenv('BUILD_ID')
if (buildId != null)
    buildVersion = "${mod_version}+b${buildId}"

version = "v${buildVersion}-mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenLocal()
        maven { url = 'https://maven.blamejared.com/' }
        maven { url = 'https://maven.terraformersmc.com/' }
        maven { url = 'https://modmaven.dev' }
        maven { url = 'https://cursemaven.com' }
        maven { url = 'https://maven.shedaniel.me/' }
        maven { url = 'https://maven.ithundxr.dev/snapshots' }

        flatDir {
            dir rootProject.file('libs')
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'net.neoforged.moddev'
    apply plugin: 'idea'

    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    sourceSets {
        generated.resources { srcDir 'src/generated/resources' }
    }

    processResources {
        from sourceSets.main.resources      // main first → wins on DuplicatesStrategy.EXCLUDE
        from sourceSets.generated.resources // generated second
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        exclude '.cache'
        exclude 'assets/ccw/unused'
    }

    configurations {
        runtimeClasspath.extendsFrom localRuntime
    }

    dependencies {
        compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
        runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

        compileOnly("dev.emi:emi-neoforge:${emi_version}:api")
//        runtimeOnly("dev.emi:emi-neoforge:${emi_version}")
    }

    neoForge {
        version = project.neo_version

//        parchment {
//            mappingsVersion = project.parchment_mappings_version
//            minecraftVersion = project.parchment_minecraft_version
//        }
    }

    var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
        var replaceProperties = [
                minecraft_version      : minecraft_version,
                minecraft_version_range: minecraft_version_range,
                neo_version            : neo_version,
                mod_id                 : mod_id,
                mod_name               : mod_name,
                mod_license            : mod_license,
                mod_version            : mod_version,
        ]
        inputs.properties replaceProperties
        expand replaceProperties
        from "src/main/templates"
        into 'build/generated/sources/modMetadata'
    }

    sourceSets.main.resources.srcDir generateModMetadata
    neoForge.ideSyncTask generateModMetadata

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

def compatProjects = [
        project(':compat-apotheosis'),
        project(':compat-farmersdelight'),
        project(':compat-fruitsdelight'),
        project(':compat-kaleidoscope'),
        project(':compat-neapolitan'),
        project(':compat-youkaisfeasts'),
        project(':compat-youkaishomecoming')
]

// activeCompats must be defined BEFORE apply from: so the applied script can reference it via ext.
ext.activeCompats = [
//        project(':compat-apotheosis'),
//        project(':compat-farmersdelight'),
//        project(':compat-fruitsdelight'),
//        project(':compat-kaleidoscope'),
//        project(':compat-neapolitan'),
//        project(':compat-youkaisfeasts'),
//        project(':compat-youkaishomecoming')
]

apply from: "$rootDir/gradle/lang-merge-and-conflicts.gradle"

tasks.register('runAllCompatAndDataRunData') {
    group = 'mod development'
    description = 'Runs runData for :data and all compat subprojects, then aggregates lang files into core.'

    def runDataProjects = [project(':data')] + activeCompats
    dependsOn(runDataProjects.collect { it.tasks.named('runData') })
    finalizedBy(tasks.named('aggregateLangResources'))
}

project(':core') {
    neoForge {
        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }

        runs {
            client {
                client()
                gameDirectory = rootProject.file('run')
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                gameDirectory = rootProject.file('run')
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            gameTestServer {
                type = 'gameTestServer'
                gameDirectory = rootProject.file('run')
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }
    }

    dependencies {
        // JEI
        compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
        runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

        // EMI WIP
        compileOnly("dev.emi:emi-neoforge:${emi_version}:api")
//    runtimeOnly("dev.emi:emi-neoforge:${emi_version}")
    }

}

project(':data') {
    neoForge {
        mods {
            "${mod_id}" {
                def coreMainSourceSet = rootProject.project(':core').sourceSets.main
                def coreGeneratedSourceSet = rootProject.project(':core').sourceSets.generated
                sourceSet(coreGeneratedSourceSet)
                sourceSet(coreMainSourceSet)
                sourceSet(sourceSets.generated)
                sourceSet(sourceSets.main)
            }
        }

        runs {
            data {
                clientData()
                programArguments.addAll '--mod', project.mod_id, '--all',
                        '--output', rootProject.project(':core').file('src/generated/resources/').getAbsolutePath(),
                        '--existing', rootProject.project(':core').file('src/main/resources/').getAbsolutePath()
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }
    }

    dependencies {
        implementation project(':core')
    }
}

