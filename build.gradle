        implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")
        // https://www.curseforge.com/minecraft/mc-mods/gensokyo-delight-youkais-feasts/files
        implementation("curse.maven:gensokyo-delight-youkais-feasts-1309991:8004770")
