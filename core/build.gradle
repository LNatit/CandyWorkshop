plugins {
    id 'java-library'
}

var build_version = mod_version
var build_id = System.getenv("BUILD_ID")
if (build_id != null) build_version = "${mod_version}+b${build_id}"

// Include resources generated by data generators.
sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

dependencies {
    // JEI
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // EMI WIP
    compileOnly("dev.emi:emi-neoforge:${emi_version}:api")
//    runtimeOnly("dev.emi:emi-neoforge:${emi_version}")

    // Apothesis
    implementation("curse.maven:patchouli-306770:6164617")
    implementation("curse.maven:placebo-283644:6446766-sources")
    implementation("curse.maven:apoattr-898963:6514649-sources")
    implementation("curse.maven:apoench-1063926:6631673-sources")
    implementation("curse.maven:apospaw-986583:6689771-sources")
    implementation("curse.maven:apotheosis-313970:6545942-sources")

    // Farmers Delight
    // FD has no src to download
    // https://www.curseforge.com/minecraft/mc-mods/farmers-delight/files
    implementation("curse.maven:farmersdelight-398521:7596366")

    // FruitsDelight
    implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")
    implementation("fruitsdelight:fruitsdelight:1.2.9")
    // for datagen issue
    runtimeOnly("curse.maven:cuisine-delight-893541:6677783")

    // KaleidoScope
    // Cookery
    // https://www.curseforge.com/minecraft/mc-mods/kaleidoscope-cookery/files
    implementation("curse.maven:kaleidoscope-cookery-1309203:7738871")
    // Nether
    // https://www.curseforge.com/minecraft/mc-mods/kaleidoscope-nether/files
//    implementation("curse.maven:kaleidoscope-nether-1417862:7732247")
    // End
    // https://www.curseforge.com/minecraft/mc-mods/kaleidoscope-end/files
//    implementation()

    // Neapolitan
    implementation("curse.maven:blueprint-382216:7148094")
    implementation("curse.maven:neapolitan-382016:7119475")
    // datagen issue
    runtimeOnly("curse.maven:gallery-1173553:6449910")

    compileOnly("l2core:l2core:3.0.8+3")
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : build_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude '.cache'
    exclude 'assets/ccw/unused'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
